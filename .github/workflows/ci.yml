name: CI

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release for this tag (e.g. v0.1.0) from the chosen branch; the tag is created on its head when it does not exist. Empty = build only.'
        required: false
        default: ''

permissions:
  contents: write   # release upload on tags; read is enough for everything else

jobs:
  build:
    name: Build, test, package (windows-latest)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Compute version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } elseif ('${{ github.event.inputs.release_tag }}' -ne '') {
            $v = '${{ github.event.inputs.release_tag }}'.TrimStart('v')
          } else {
            $v = "0.1.0-ci.${{ github.run_number }}"
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Restore
        run: dotnet restore TfPortable.slnx

      - name: Build (Release)
        run: dotnet build TfPortable.slnx -c Release --no-restore -p:Version=${{ steps.version.outputs.version }}

      - name: Unit tests
        run: dotnet test tests/TfPortable.Tests -c Release --no-build --logger "trx;LogFileName=unit.trx" --results-directory TestResults

      - name: Integration and golden tests (skipped without secrets)
        env:
          TFP_TEST_COLLECTION: ${{ secrets.TFP_TEST_COLLECTION }}
          TFP_TEST_PAT: ${{ secrets.TFP_TEST_PAT }}
        run: dotnet test tests/TfPortable.IntegrationTests -c Release --no-build --logger "trx;LogFileName=integration.trx" --results-directory TestResults

      - name: Package tfp.exe
        shell: pwsh
        run: |
          $exe = 'src/TfPortable/bin/Release/net48/tfp.exe'
          if (-not (Test-Path $exe)) { throw "tfp.exe not found at $exe" }
          New-Item -ItemType Directory -Force artifacts | Out-Null
          Copy-Item $exe artifacts/tfp.exe
          $hash = (Get-FileHash artifacts/tfp.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *tfp.exe" | Out-File -Encoding ascii -NoNewline artifacts/tfp.exe.sha256
          Write-Host "tfp.exe: $((Get-Item artifacts/tfp.exe).Length) bytes, SHA-256 $hash"

      - name: Check the embedded assemblies against THIRD-PARTY-NOTICES
        shell: pwsh
        run: |
          # Costura embeds every non-excluded dependency as a resource. The list must match
          # src/TfPortable/embedded-assemblies.txt, which THIRD-PARTY-NOTICES covers (milestone 5).
          $asm = [System.Reflection.Assembly]::LoadFile((Resolve-Path artifacts/tfp.exe).Path)
          $names = $asm.GetManifestResourceNames() |
            Where-Object { $_ -like 'costura.*' } |
            ForEach-Object { ($_ -replace '^costura\.', '') -replace '\.dll(\.compressed)?$', '' } |
            Sort-Object -Unique
          Write-Host "Embedded assemblies ($($names.Count)):"
          $names | ForEach-Object { Write-Host "  $_" }
          $expectedFile = 'src/TfPortable/embedded-assemblies.txt'
          if (-not (Test-Path $expectedFile)) {
            throw "Missing $expectedFile; create it with the list above and check THIRD-PARTY-NOTICES."
          }
          $expected = Get-Content $expectedFile | ForEach-Object { $_.Trim() } | Where-Object { $_ -and -not $_.StartsWith('#') } | Sort-Object -Unique
          $diff = Compare-Object -ReferenceObject @($expected) -DifferenceObject @($names)
          if ($diff) {
            $diff | ForEach-Object { Write-Host "$($_.SideIndicator) $($_.InputObject)" }
            throw "The embedded assemblies differ from $expectedFile (=> embedded but not listed, <= listed but not embedded). Update the list and THIRD-PARTY-NOTICES."
          }
          exit 0

      - name: Run tfp.exe alone in an empty folder
        shell: pwsh
        run: |
          # Excluded assemblies are still present in bin/, so only a copy of the exe alone proves the Costura packaging.
          $dir = Join-Path $env:RUNNER_TEMP ('tfp-alone-' + [guid]::NewGuid().ToString('N').Substring(0, 8))
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item artifacts/tfp.exe (Join-Path $dir 'tfp.exe')
          Push-Location $dir
          try {
            & .\tfp.exe version
            if ($LASTEXITCODE -ne 0) { throw "tfp version exited with $LASTEXITCODE" }
            $json = & .\tfp.exe help /format:json | Out-String
            if ($LASTEXITCODE -ne 0) { throw "tfp help /format:json exited with $LASTEXITCODE" }
            $envelope = $json | ConvertFrom-Json
            if (-not $envelope.ok -or $envelope.command -ne 'help' -or $envelope.data.commands.Count -lt 20) { throw "unexpected help envelope: $json" }
            Write-Host "help /format:json: $($envelope.data.commands.Count) commands"
            & .\tfp.exe status /recursive /noprompt
            if ($LASTEXITCODE -ne 120) { throw "tfp status outside a workspace exited with $LASTEXITCODE, expected 120 (TFP0201)" }
            & .\tfp.exe nosuchcommand
            if ($LASTEXITCODE -ne 2) { throw "tfp nosuchcommand exited with $LASTEXITCODE, expected 2" }
          } finally {
            Pop-Location
          }
          # The last native command deliberately exited with 2; pwsh would otherwise report the step as failed.
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: tfp-${{ steps.version.outputs.version }}
          path: |
            artifacts/tfp.exe
            artifacts/tfp.exe.sha256
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_number }}
          path: TestResults/*.trx
          if-no-files-found: ignore

      - name: GitHub release
        if: github.ref_type == 'tag' || github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A pushed tag releases that tag; a manual run releases the given tag, creating it on this commit when it
          # does not exist yet (the tag push that follows re-runs this job and finds the release already there).
          $tag = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}' } else { '${{ github.event.inputs.release_tag }}' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists; nothing to do."
            exit 0
          }
          $target = if ('${{ github.ref_type }}' -eq 'tag') { @('--verify-tag') } else { @('--target', '${{ github.sha }}') }
          gh release create $tag artifacts/tfp.exe artifacts/tfp.exe.sha256 `
            --title "TfPortable ${{ steps.version.outputs.version }}" `
            --notes 'tfp.exe (single file, .NET Framework 4.8) and its SHA-256. See README.md for installation and docs/compat.md for differences from tf.exe. Not a Microsoft product.' `
            @target
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed with exit $LASTEXITCODE" }
